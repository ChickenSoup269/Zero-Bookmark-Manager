<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Save Bookmark</title>
  <link rel="stylesheet" href="./styles/variables.css">
  <link rel="stylesheet" href="./styles/theme.css">
  <link rel="stylesheet" href="./styles/quick-save.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="./theme-init.js"></script>
</head>

<body class="dark-theme">
  <main class="quick-save-shell">
    <header class="quick-save-header">
      <div>
        <h1 data-i18n="qsTitle">Quick Save</h1>
        <p data-i18n="qsDesc">Save the current page with tags and notes.</p>
      </div>
      <button id="open-dashboard" class="icon-button" type="button" title="Open full dashboard" aria-label="Open full dashboard">↗</button>
    </header>

    <section id="status" class="status hidden" role="status"></section>

    <form id="quick-save-form" class="quick-save-form">
      <label>
        <span data-i18n="qsAction">Click Extension Action</span>
        <div id="quick-open-action-group" class="quick-action-group">
          <button type="button" class="quick-action-btn active" data-value="quickSave" data-i18n="btnQuickSave">Quick Save</button>
          <button type="button" class="quick-action-btn" data-value="popup" data-i18n="btnPopup">Popup</button>
          <button type="button" class="quick-action-btn" data-value="nativePopup" data-i18n="btnNativePopup">Browser Popup</button>
          <button type="button" class="quick-action-btn" data-value="sidepanel" data-i18n="btnPanel">Panel</button>
          <button type="button" class="quick-action-btn" data-value="web" data-i18n="btnFull">Full</button>
        </div>
      </label>

      <div style="display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-bottom: 8px;">
        <span style="font-size: 0.9rem; color: var(--text-primary); user-select: none;">Save multiple tabs</span>
        <label class="toggle-switch">
          <input type="checkbox" id="multi-save-toggle">
          <span class="toggle-knob"></span>
        </label>
      </div>

      <div id="single-save-fields">
        <label>
          <span data-i18n="lblTitle">Title</span>
          <input id="title" type="text" autocomplete="off">
        </label>

        <label>
          <span data-i18n="lblUrl">URL</span>
          <input id="url" type="url" autocomplete="off">
        </label>
      </div>

      <div id="multi-save-fields" class="hidden" style="margin-bottom: 12px;">
        <label style="margin-bottom: 0;">
          <span>Select tabs to save (<span id="multi-save-count">0</span>)</span>
        </label>
        <div id="multi-save-tab-list" class="multi-tab-list">
          <!-- Tabs injected here -->
        </div>
      </div>

      <label>
        <span data-i18n="lblFolder">Folder</span>
        <div style="display: flex; flex-direction: column; gap: 0;">
          <button type="button" id="open-folder-view-btn" style="width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-primary); color: var(--text-primary); cursor: pointer; text-align: left; font-size: 0.9rem; transition: border-color 0.2s, box-shadow 0.2s;">
            <span style="display: flex; align-items: center; gap: 10px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;">
              <i class="fas fa-folder" style="color: var(--accent-color);"></i> 
              <span id="selected-folder-name-display">Bookmarks Bar</span>
            </span>
            <i class="fas fa-chevron-right" style="color: var(--text-secondary); font-size: 0.8em;"></i>
          </button>
          <input id="quick-new-folder-input" type="text" autocomplete="off" placeholder="Or type new folder name..." data-i18n-placeholder="phQuickNewFolder" style="font-size: 0.85rem; padding: 8px; margin-top: 8px; border-radius: 8px;">
        </div>
      </label>

      <label style="position: relative;">
        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
          <span data-i18n="lblTags">Tags</span>
          <button type="button" id="suggest-tag-btn" class="icon-button" style="width: auto; height: 24px; padding: 0 8px; font-size: 0.75rem; border-radius: 12px; gap: 4px; display: inline-flex; justify-content: center; align-items: center;">
            <i class="fas fa-wand-magic-sparkles" id="suggest-tag-icon"></i>
            <span id="suggest-tag-text" data-i18n="btnSuggestText">Suggest</span>
          </button>
        </div>
        <div id="tags-container" class="tags-container">
          <div id="tags-input-wrapper" style="display: inline-flex; align-items: center; flex: 1; min-width: 150px;">
            <input id="tags-input" class="tags-input" type="text" autocomplete="off" placeholder="Type and press Enter..." data-i18n-placeholder="phTags" style="flex: 1;">
            <button type="button" id="next-tag-color-btn" style="width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--border-color); background-color: #3B82F6; cursor: pointer; margin-left: 4px; flex-shrink: 0;" title="Choose color for new tag"></button>
          </div>
        </div>
        <div id="suggested-tags-container" class="suggested-tags-container hidden">
          <span class="suggested-tags-label"><i class="fas fa-sparkles" style="color: var(--accent-color);"></i> <span data-i18n="lblSuggestedTags">Suggested:</span></span>
          <div id="suggested-tags-list" class="suggested-tags-list"></div>
        </div>
        <div id="custom-tag-suggestions" class="custom-tag-suggestions hidden"></div>
        <input type="hidden" id="tags" value="">
      </label>

      <label>
        <span data-i18n="lblNotes">Notes</span>
        <textarea id="notes" rows="5" placeholder="Why this page matters, what to revisit, or any context you need later." data-i18n-placeholder="phNotes"></textarea>
      </label>

      <div class="actions">
        <button id="save" class="primary-button" type="submit" data-i18n="btnSaveBookmark">Save Bookmark</button>
      </div>
    </form>
    
    <!-- Folder Selection View (Detailed Popup/Step) -->
    <div id="folder-selection-view" class="hidden" style="display: flex; flex-direction: column; padding-bottom: 12px; height: 100%;">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <button type="button" id="close-folder-view-btn" class="icon-button" style="width: 32px; height: 32px; border: 1px solid var(--border-color); border-radius: 8px;"><i class="fas fa-arrow-left"></i></button>
          <h3 style="margin: 0; font-size: 1.1rem; color: var(--text-primary);" data-i18n="lblSelectFolder">Select Folder</h3>
        </div>
        <button type="button" id="done-folder-view-btn" class="button save" style="padding: 6px 16px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; background: var(--accent-color); color: var(--bg-primary);" data-i18n="btnDone">Done</button>
      </div>
      
      <input id="folder-search-input" type="text" autocomplete="off" placeholder="Search folders..." data-i18n-placeholder="phSearchFolder" style="margin-bottom: 12px; padding: 10px; font-size: 0.95rem;">
      
      <div id="folder-list" class="folder-tree-view" style="max-height: none; height: 350px; resize: none; margin-bottom: 12px;"></div>
      
      <div style="display: flex; gap: 8px;">
        <input id="new-folder-input" type="text" autocomplete="off" placeholder="New folder name..." data-i18n-placeholder="phNewFolder" style="flex: 1; margin: 0;">
        <button type="button" id="create-folder-btn" class="icon-button" title="Create new folder" style="width: 38px; height: 38px; border-radius: 8px; flex-shrink: 0; background: var(--accent-color); color: var(--bg-primary);">
          <i class="fas fa-plus"></i>
        </button>
      </div>
    </div>
  </main>

  <script src="./quick-save.js"></script>
</body>

</html>
